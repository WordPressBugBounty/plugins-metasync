[extend]
useDefault = true

# Anvil pre-receive reads this from the tip of the pushed ref.
# PHPUnit fixtures under tests/ use placeholder API keys / key material
# (e.g. sk_live_valid_*) that trip generic-api-key. They are not real secrets.
# Keep [extend] useDefault = true — omitting it disables default rules and
# the hook rejects the push.
[allowlist]
description = "PHPUnit fixtures under tests/ (placeholder keys, not real secrets)"
paths = [
  '''^tests/''',
]
